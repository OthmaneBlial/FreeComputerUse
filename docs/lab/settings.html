<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preferences · Northstar</title><link rel="icon" type="image/svg+xml" href="../brand-mark.svg"><link rel="stylesheet" href="lab.css"></head><body><header class="masthead"><a class="logo" href="index.html"><span class="logo-mark">✳</span><span>Northstar<small>FOCUSED BROWSER CHECK</small></span></a><nav><a href="index.html">Task library</a><a href="workspace.html?view=products">Practice workspace</a></nav><span class="sandbox-tag">SYNTHETIC DATA</span></header><main class="legacy-page"><p>PUBLIC BROWSER TEST LAB · Synthetic data · Forms are simulations. No messages, purchases or real account changes occur.</p><h1>Workspace preferences</h1><p>These preferences are stored in this browser only.</p><form id="preferences"><label><input type="checkbox" id="dark"> Enable dark theme</label><label for="currency">Display currency</label><select id="currency"><option>EUR</option><option>USD</option><option>GBP</option></select><button>Save settings</button></form><p role="status" id="saved">No changes saved</p><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();localStorage.setItem('northstar-settings',JSON.stringify({dark:document.getElementById('dark').checked,currency:document.getElementById('currency').value}));document.getElementById('saved').textContent='Settings saved locally';};</script></main></body></html>
