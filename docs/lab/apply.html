<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application · Northstar</title><link rel="icon" href="data:,"><link rel="stylesheet" href="lab.css"></head><body><header class="masthead"><a class="logo" href="index.html"><span class="logo-mark">✳</span><span>Northstar<small>FOCUSED BROWSER CHECK</small></span></a><nav><a href="index.html">Task library</a><a href="workspace.html?view=products">Practice workspace</a></nav><span class="sandbox-tag">SYNTHETIC DATA</span></header><main class="legacy-page"><p>PUBLIC BROWSER TEST LAB · Synthetic data · Forms are simulations. No messages, purchases or real account changes occur.</p><h1>Apply to Northstar</h1><form id="application" aria-label="Application"><label for="firstName">First name</label><input id="firstName" name="firstName" required><label for="lastName">Last name</label><input id="lastName" name="lastName" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required><label for="country">Country</label><select id="country"><option>France</option><option>Germany</option><option>Spain</option></select><label for="resume">Resume</label><input id="resume" type="file" required><label for="experience">Years of experience</label><input id="experience" name="experience" type="number" required><button>Continue</button></form><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const f=e.target;sessionStorage.setItem('application',JSON.stringify({firstName:f.firstName.value,lastName:f.lastName.value,email:f.email.value}));location.href='review.html';};</script></main></body></html>
