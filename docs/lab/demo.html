<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact · Northstar</title><link rel="icon" type="image/svg+xml" href="../brand-mark.svg"><link rel="stylesheet" href="lab.css"></head><body><header class="masthead"><a class="logo" href="index.html"><span class="logo-mark">✳</span><span>Northstar<small>FOCUSED BROWSER CHECK</small></span></a><nav><a href="index.html">Task library</a><a href="workspace.html?view=products">Practice workspace</a></nav><span class="sandbox-tag">SYNTHETIC DATA</span></header><main class="legacy-page"><p>PUBLIC BROWSER TEST LAB · Synthetic data · Forms are simulations. No messages, purchases or real account changes occur.</p><h1>Contact our team</h1><p>Fill the contact form using your profile. This is a local test website.</p><form id="contact" aria-label="Contact"><label for="firstName">First name</label><input id="firstName" name="firstName" required autocomplete="given-name"><label for="lastName">Last name</label><input id="lastName" name="lastName" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="country">Country</label><select id="country" name="country"><option value="France">France</option><option>Germany</option><option>Spain</option></select><label for="message">Message</label><textarea id="message" name="message" required></textarea><label><input id="terms" type="checkbox" required> I agree to the privacy policy</label><button data-testid="contact-submit">Send message</button></form><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();await Promise.resolve();e.target.hidden=true;document.querySelector('main').insertAdjacentHTML('beforeend','<h2>Message received</h2><p role="status">Contact request saved successfully.</p>');});</script></main></body></html>
