name: Bug report
description: Report a reproducible problem without sharing private browser data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Never paste API keys, tokens, cookies, private URLs, real browser
        profiles, or personal data. Use synthetic examples and redact logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include a release version or the short commit from main.
      placeholder: main @ abc1234
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows (not validated in this project)
        - Linux (not validated in this project)
        - Other
    validations:
      required: true
  - type: input
    id: operating-system-version
    attributes:
      label: OS version and architecture
      placeholder: macOS 26.6, Apple Silicon
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js and browser versions
      placeholder: Node 25.9.0; system Chrome 154.0.8037.57
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a public or synthetic page. State the expected and actual result.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include relevant command output after removing secrets and personal data.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed keys, tokens, cookies, private URLs and personal data from this report.
          required: true
